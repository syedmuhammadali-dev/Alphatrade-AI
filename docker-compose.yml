services:
  postgres:
    image: postgres:16-alpine
    container_name: alphatrade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: alphatrade
      POSTGRES_PASSWORD: alphatrade
      POSTGRES_DB: alphatrade
    ports:
      - "5432:5432"
    volumes:
      - alphatrade-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphatrade -d alphatrade"]
      interval: 5s
      timeout: 5s
      retries: 10

  # redis:
  #   image: redis:7-alpine
  #   container_name: alphatrade-redis
